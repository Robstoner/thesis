services:
  db:
    image: postgres:15
    container_name: labellogic_db_dev
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labellogic_user -d labellogic_app"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - labellogic_dev_network

  minio:
    image: minio/minio:latest
    container_name: labellogic_minio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ./backend/.env
    volumes:
      - minio_data_dev:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - labellogic_dev_network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: labellogic_backend_dev
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - labellogic_dev_network

volumes:
  postgres_data_dev:
  minio_data_dev:

networks:
  labellogic_dev_network: