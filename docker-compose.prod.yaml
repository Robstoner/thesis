version: '3.8'

services:
  db:
    image: postgres:15
    container_name: nutrition_db
    environment:
      POSTGRES_DB: nutrition_app
      POSTGRES_USER: nutrition_user
      POSTGRES_PASSWORD: nutrition_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrition_user -d nutrition_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: nutrition_backend
    environment:
      - DATABASE_URL=postgresql://nutrition_user:nutrition_password@db:5432/nutrition_app
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: